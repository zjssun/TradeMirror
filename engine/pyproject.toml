[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trademirror-engine"
version = "0.1.0"
description = "Local analysis engine for TradeMirror"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "MetaTrader5>=5.0.5370",
  "numpy>=2.0,<3.0",
  "pandas>=2.2,<4.0",
  "Pillow>=11.0,<12.0",
  "python-multipart>=0.0.20,<1.0",
  "pydantic>=2.10,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
